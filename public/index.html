<!doctype html>
<html lang="es" data-brand="obsidiana">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telas JY</title>
<meta name="theme-color" content="#0D0D0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Telas JY">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Opción E · Obsidiana: negro cálido con champán; tipografía ligera y mucho aire ===== */
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0D0D0E;--surface:#151516;--surface2:#1B1B1D;--line:#2A2A2D;--line2:#202023;--text:#EEEAE3;--muted:#A39F97;--field:#151516;--field-line:#58564F;--ok:#7FCB9B;--warn:#E3B15A;--bad:#E58B73;--lime:#D6B97A;--lime-ink:#17120A;--gold:#D6B97A;--brass:#D6B97A;--brass-line:#D6B97A;--brass-text:#D6B97A;--hero:#151516;--hero-ink:#EEEAE3;--hero-muted:#A39F97;--hero-bad:#F0A08A;--saldo-soft:#CDB9B2;--accent:#D6B97A;--btn:#D6B97A;--btn-ink:#17120A;--debt-bg:#1F1411;--debt-fill:#E58B73;--debt-ink:#1E0B05;--ring:#D6B97A;--tk:#D6B97A;--chk:#D6B97A;--navact:#17120A;--shadow:rgba(0,0,0,.65);--color-scheme:dark;--ease:cubic-bezier(.23,1,.32,1);--pop:cubic-bezier(.34,1.35,.64,1);--drawer:cubic-bezier(.32,.72,0,1);--x:16px;--y:14px;--s:.94;}
@media (prefers-color-scheme:light){
:root{--bg:#F1F1F0;--surface:#FFFFFF;--surface2:#F8F8F7;--line:#DCDBD7;--line2:#E9E8E5;--text:#141414;--muted:#5A5852;--field:#FFFFFF;--field-line:#9E9B93;--ok:#1D6A40;--warn:#85550A;--bad:#A8432B;--lime:#7A5C18;--lime-ink:#FFFFFF;--gold:#7A5C18;--brass:#7A5C18;--brass-line:#7A5C18;--brass-text:#7A5C18;--hero:#FFFFFF;--hero-ink:#141414;--hero-muted:#5A5852;--hero-bad:#A8432B;--saldo-soft:#6B4640;--accent:#7A5C18;--btn:#141414;--btn-ink:#F2E3BC;--debt-bg:#FBF3F0;--debt-fill:#A8432B;--debt-ink:#FFFFFF;--ring:#7A5C18;--tk:#7A5C18;--chk:#141414;--navact:#F2E3BC;--shadow:rgba(20,20,20,.2);--color-scheme:light;}
}
@media (prefers-reduced-motion:reduce){:root{--x:0px;--y:0px;--s:1}}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;scrollbar-color:var(--line) transparent}
*,*::before,*::after{box-sizing:inherit}
::selection{background:color-mix(in srgb,var(--lime) 40%,transparent);color:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Manrope',system-ui,sans-serif;font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;caret-color:var(--lime);touch-action:manipulation}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;transition:transform 110ms var(--ease),background-color 140ms ease,border-color 140ms ease,color 140ms ease}
button:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px}
.serif{font-family:'Manrope',system-ui,sans-serif;font-weight:700;font-variant-numeric:lining-nums tabular-nums;font-optical-sizing:auto;letter-spacing:-.02em}
#app{max-width:760px;margin:0 auto;padding-bottom:112px}
.hero{background:var(--hero);color:var(--hero-ink);padding:12px 20px 22px;position:relative;border-radius:0 0 28px 28px;border-bottom:1px solid var(--line)}
.hero .cn,.sheet .cn{max-width:980px;margin:0 auto}
.sheet .cn.narrow{max-width:460px}
.sheet{background:transparent;padding:10px 16px 28px;min-height:50vh}
.htop{display:flex;justify-content:space-between;align-items:center;min-height:46px}
.brand{display:flex;align-items:center;gap:10px}
.mono{width:38px;height:38px;border-radius:12px;background:var(--btn);color:var(--btn-ink);display:inline-flex;align-items:center;justify-content:center;font-family:'Manrope',system-ui,sans-serif;font-weight:700;font-size:16px;letter-spacing:-.02em}
.mono.big{width:72px;height:72px;border-radius:22px;font-size:30px}
.rolechip{background:var(--surface2);border:1px solid var(--line);color:var(--muted);font-size:12px;font-weight:500;padding:5px 12px;border-radius:999px}
.ib{width:44px;height:44px;border:1px solid var(--line);background:var(--surface2);color:var(--text);display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.ht{font-size:38px;line-height:1.04;margin-top:18px;letter-spacing:-.03em;text-wrap:balance}
.big{font-size:68px;line-height:1;margin-top:18px;letter-spacing:-.035em}
.big.dbt{color:var(--hero-bad)}
.kick{margin-top:8px;font-size:14px;color:var(--muted);font-weight:500}
.hsub{font-size:14px;color:var(--hero-muted);margin-top:10px}
.stats{display:grid;gap:14px;margin-top:20px}
.st{padding:10px 0 0;border-top:1px solid var(--line)}
.sv{font-size:28px;line-height:1.1}
.sl{font-size:12px;color:var(--muted);line-height:1.25;margin-top:2px}
.st.w{border-top-color:var(--bad)}
.st.w .sv,.st.w .sl{color:var(--hero-bad)}
.ruler,.trama{display:none}
.h1{font-size:32px;margin:22px 0 14px;line-height:1.08;letter-spacing:-.03em}
.h2{font-size:24px;margin:0;letter-spacing:-.025em}
.lb{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--muted)}
.fi{height:54px;width:100%;border:1.5px solid var(--field-line);border-radius:14px;background:var(--field);color:var(--text);padding:0 14px;font-size:17px;transition:border-color 140ms ease,box-shadow 140ms ease}
.fi:focus{outline:none;border-color:var(--ring);box-shadow:0 0 0 4px color-mix(in srgb,var(--ring) 22%,transparent)}
select.fi{padding:0 10px}
.fi::placeholder{color:var(--muted);opacity:.75}
.fld{margin-bottom:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{height:56px;width:100%;border-radius:16px;border:none;background:var(--btn);color:var(--btn-ink);font-weight:600;font-size:16px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.b{background:var(--lime);color:var(--lime-ink)}
.btn.o{background:transparent;border:1.5px solid var(--accent);color:var(--accent)}
.btn.o2{background:transparent;border:1.5px solid var(--field-line);color:var(--text)}
.btn.w{background:transparent;border:1.5px solid var(--field-line);color:var(--text)}
.btn.sm{height:46px;font-size:14px;border-radius:12px}
.btn+.btn{margin-top:10px}
.mut{color:var(--muted);font-size:13px}
.err{color:var(--bad);font-size:13px;font-weight:600;min-height:18px;margin:6px 0}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:10px 0 6px;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;scrollbar-width:none}
.tab{height:42px;padding:0 14px;border:none;border-radius:12px;background:none;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap}
.tab.on{background:var(--btn);color:var(--btn-ink);font-weight:600}
.pills{display:flex;gap:8px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.pill{height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font-weight:500;font-size:14px;white-space:nowrap}
.pill.on{background:var(--btn);border-color:var(--btn);color:var(--btn-ink);font-weight:600}
.seg{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px}
.seg button{flex:1;height:48px;border:none;border-radius:12px;background:transparent;color:var(--text);font-weight:500;font-size:14px}
.seg button.on{background:var(--btn);color:var(--btn-ink);font-weight:600}
.seg.dk{background:var(--surface2)}
.seg.dk button{color:var(--text)}
.seg.dk button.on{background:var(--btn);color:var(--btn-ink)}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.c-prog{background:color-mix(in srgb,var(--lime) 16%,var(--surface));color:var(--text)}
.c-ok{background:color-mix(in srgb,var(--ok) 20%,var(--surface));color:color-mix(in srgb,var(--ok) 78%,var(--text))}
.c-warn{background:color-mix(in srgb,var(--warn) 22%,var(--surface));color:color-mix(in srgb,var(--warn) 75%,var(--text))}
.c-done{background:var(--line2);color:var(--muted)}
.c-late{border:1.5px solid var(--bad);color:var(--bad)}
.c-cancel{background:color-mix(in srgb,var(--bad) 18%,var(--surface));color:var(--bad)}
.ch-hero{background:var(--surface2);border:1px solid var(--line);color:var(--text)}
.debt{background:var(--debt-fill);color:var(--debt-ink);font-weight:700;font-size:14px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.good{color:var(--ok);font-weight:600}
.ord{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:8px}
.ord .l>b{font-size:17px;min-width:0;font-weight:600}
.ord .l>.serif{font-size:26px!important;white-space:nowrap;flex:none}
.l{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hrow .serif,.dh .serif,.crow .serif{white-space:nowrap}
.ticks{display:flex;gap:3px}
.tk{width:20px;height:6px;border-radius:3px;background:var(--line)}
.tk.f{background:var(--tk)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
.box.tot{background:var(--surface2);color:var(--text);border:1px solid var(--line);--hero-muted:var(--muted);padding:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 16px}
.sec{padding:22px 0 8px;border-bottom:1px solid var(--line2)}
.sec:last-child{border-bottom:none}
.crow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.crow:last-child{border-bottom:none}
.crow input[type=checkbox],.ck input{width:28px;height:28px;accent-color:var(--chk);margin:0;flex:none}
.ck{display:flex;align-items:center;gap:12px;min-height:48px;font-size:15px}
.st-t{text-decoration:line-through;color:var(--muted)}
.saldo{background:var(--debt-bg);color:var(--text);border:1.5px solid var(--bad);border-radius:24px;padding:22px 18px 20px;margin:18px 0}
.saldo .big{font-size:64px;margin-top:2px;color:var(--hero-bad)}
.saldo .fi{background:var(--field)}
.saldo .g2 .btn{font-size:15px;padding:0 8px}
.pagado{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok);border-radius:20px;padding:18px 20px;margin:18px 0;font-weight:600;font-size:17px}
.note{background:color-mix(in srgb,var(--warn) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:16px;padding:12px 14px;margin:0 0 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.aviso{background:var(--warn);color:#1D1200;font-weight:600;text-align:center;padding:10px 16px}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 8px;font-weight:600}
.hrow{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;margin-bottom:6px}
.empty{text-align:center;color:var(--muted);padding:36px 0}
.menu{display:flex;width:100%;align-items:center;justify-content:space-between;min-height:62px;background:var(--surface);border:1px solid var(--line);border-radius:18px;text-align:left;font-weight:600;font-size:16px;padding:0 18px;margin-bottom:8px}
#cargando{position:fixed;left:0;right:0;top:0;height:3px;background:var(--lime);z-index:80;display:none;transform-origin:left;animation:carga 900ms var(--ease) infinite}
@keyframes carga{0%{transform:scaleX(0);transform-origin:left}50%{transform:scaleX(1);transform-origin:left}51%{transform-origin:right}100%{transform:scaleX(0);transform-origin:right}}
#nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:40;display:flex;gap:2px;padding:6px;background:var(--surface2);border:1px solid var(--line);border-radius:26px;box-shadow:0 16px 32px -14px var(--shadow)}
#nav button{flex:1;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;border-radius:20px;color:var(--muted);font-size:11.5px;font-weight:500}
#nav button.on{background:var(--btn);color:var(--btn-ink);font-weight:600}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:14px 20px;border-radius:16px;font-weight:500;z-index:70;max-width:90%;text-align:center;box-shadow:0 16px 30px -12px var(--shadow);
opacity:0;visibility:hidden;transform:translate(-50%,var(--y)) scale(var(--s));transition:opacity 140ms ease,transform 160ms var(--ease),visibility 0s linear 160ms}
#toast.show{opacity:1;visibility:visible;transform:translate(-50%,0) scale(1);transition:opacity 160ms ease,transform 280ms var(--pop),visibility 0s}
#modal{position:fixed;inset:0;background:rgba(2,5,3,.62);z-index:60;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity 150ms ease,visibility 0s linear 150ms}
#modal.open{opacity:1;visibility:visible;transition:opacity 200ms ease,visibility 0s}
#modal .mb{position:relative;background:var(--surface2);border:1px solid var(--line);border-bottom:none;width:min(520px,100%);border-radius:28px 28px 0 0;padding:30px 20px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform 160ms var(--ease)}
#modal .mb::before{content:"";position:absolute;top:10px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}
#modal.open .mb{transform:none;transition:transform 280ms var(--drawer)}
.navlogo{display:none}
#app.enter[data-scr=detalle]>.sheet,#app.enter[data-scr=nuevo]>.sheet,#app.enter[data-scr=saldos]>.sheet,#app.enter[data-scr=ajustes]>.sheet,#app.enter[data-scr=accesos]>.sheet,#app.enter[data-scr=clave]>.sheet{animation:empuja 220ms var(--ease) both}
@keyframes empuja{from{opacity:0;transform:translateX(var(--x))}to{opacity:1;transform:none}}
@media (hover:hover) and (pointer:fine){
.btn:hover{filter:brightness(1.1)}
.btn.o:hover,.btn.o2:hover,.btn.w:hover{background:color-mix(in srgb,var(--lime) 12%,transparent)}
.ord:hover,.menu:hover{border-color:var(--field-line);background:var(--surface2)}
.tab:not(.on):hover,.pill:not(.on):hover{color:var(--text)}
.seg button:not(.on):hover{background:color-mix(in srgb,var(--text) 8%,transparent)}
#nav button:not(.on):hover{color:var(--text)}
}
/* --- acabado sobrio --- */
.hero{background:var(--bg);border-radius:0;border-bottom:1px solid var(--line)}
.ord,.box,.card,.hrow,.menu{border-radius:14px}
.ord{box-shadow:none}
.btn{border-radius:12px;font-weight:600}
.btn.sm{border-radius:10px}
.fi{border-radius:12px;border-width:1px}
.fi:focus{border-width:1px}
.seg,.tabs{border-radius:14px}
.seg button,.tab{border-radius:10px}
.saldo{border-width:1px;border-radius:16px}
.saldo .big{font-size:60px}
.pagado,.note{border-radius:14px}
.tk{height:4px;border-radius:2px}
#nav{border-radius:22px;box-shadow:0 12px 28px -16px var(--shadow)}
#nav button{border-radius:16px}
.chip{font-weight:600}
.menu{font-weight:500}
@media (prefers-reduced-motion:reduce){:root{--x:0px;--y:0px;--s:1}}

.serif{font-weight:600;letter-spacing:-.02em}
.ht{font-weight:600;letter-spacing:-.035em;font-size:38px}
.big{font-weight:300;letter-spacing:-.04em;font-size:76px}
.saldo .big{font-weight:300}
.sv{font-weight:500}
.ord .l>.serif,.hrow .serif,.crow .serif{font-weight:500}
.mono{border-radius:50%;font-weight:600;font-size:15px}
.mono.big{border-radius:50%}
.rolechip{letter-spacing:.02em}
.lb{letter-spacing:.01em}

/* --- Nuevo pedido: más fácil --- */
.cut-h{display:flex;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.cut-h b{font-weight:600}
.nuevo .box .ck{border:1px solid var(--line);border-radius:12px;padding:0 14px;min-height:54px;background:var(--surface2)}
.nuevo .box .ck:has(input:checked){border-color:var(--ring)}
.nuevo .sec>.l .mut{font-size:13px}
.nbar{position:sticky;bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:30;margin-top:14px;padding:10px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:18px;box-shadow:0 16px 32px -16px var(--shadow)}
.nbar .err{margin:0 0 8px;min-height:0}
.nbar .err:empty{display:none}
.nbar-in{display:flex;align-items:center;gap:14px}
.nbar-t{display:flex;flex-direction:column;line-height:1.05;min-width:96px}
.nbar-t b{font-size:28px;white-space:nowrap}
.nbar .btn{flex:1;margin:0;height:56px}

/* --- Todas las pantallas: más simples y legibles --- */
body{font-size:16px}
.mut{font-size:14px}
.lb{font-size:14px}
.sl{font-size:13px}
.chip{font-size:13px}
.ord{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:16px}
.ord-main{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.ord-n{font-size:18px;font-weight:600;line-height:1.25}
.ord-meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:2px}
.ord-amt{display:flex;flex-direction:column;align-items:flex-end;gap:1px;flex:none;text-align:right;max-width:46%}
.ord-amt .serif{white-space:nowrap}
.amt{font-size:26px}
.amt-d{font-size:30px;color:var(--bad);line-height:1.05}
.debt-l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--bad)}
.ord .good{font-size:14px}
.tab .cnt{display:inline-block;min-width:22px;padding:0 6px;margin-left:4px;border-radius:999px;background:color-mix(in srgb,var(--text) 12%,transparent);font-size:12px;font-weight:700;line-height:20px;text-align:center}
.tab.on .cnt{background:color-mix(in srgb,var(--btn-ink) 20%,transparent)}
.fechas{margin:2px 0 6px}
.fechas summary{display:flex;align-items:center;min-height:48px;cursor:pointer;color:var(--accent);font-weight:600;list-style:none}
.fechas summary::-webkit-details-marker{display:none}
.fechas summary::after{content:'+';margin-left:8px;font-size:20px;line-height:1}
.fechas[open] summary::after{content:'−'}
.menu{min-height:68px}
.menu-t{display:flex;flex-direction:column;gap:2px}
.menu-t b{font-weight:600;font-size:16px}
.menu-t small{font-size:14px;font-weight:400;color:var(--muted)}
.btn.quiet{border-color:var(--line);color:var(--muted)}
.hright{display:flex;align-items:center;gap:8px}
.ib.lo{width:auto;height:40px;margin:0;padding:0 14px 0 12px;gap:7px;border-radius:999px;font-size:13px;font-weight:600;color:var(--text)}
.ib.lo span,.rolechip,.brand .serif{white-space:nowrap}
@media (max-width:420px){.brand .serif{display:none}}
.ib.lo svg{width:18px;height:18px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger-fill{background:var(--debt-fill);color:var(--debt-ink)}
.hrow .mut,.crow .mut{font-size:14px}
/* encabezados más bajos en pantallas de segundo nivel */
#app[data-scr=mas] .hero,#app[data-scr=saldos] .hero,#app[data-scr=clave] .hero,#app[data-scr=ajustes] .hero,#app[data-scr=accesos] .hero,#app[data-scr=cortes] .hero,#app[data-scr=nuevo] .hero{padding-bottom:12px}
#app[data-scr=mas] .ht,#app[data-scr=clave] .ht,#app[data-scr=ajustes] .ht,#app[data-scr=accesos] .ht,#app[data-scr=cortes] .ht,#app[data-scr=nuevo] .ht{font-size:30px;margin-top:6px}
/* acceso: más aire y campos grandes */
#app[data-scr=login] .h1{font-size:34px}
#app[data-scr=login] .fi{height:58px}
#app[data-scr=login] .btn{height:60px;font-size:17px}
#app[data-scr=accesos] .sec{padding-top:26px}

/* ===== Estructura nueva: barra superior desde 900 px, una columna ancha, detalle en panel ===== */
html{scrollbar-gutter:stable}
#app{--w:920px}
#app[data-scr=pedidos]{--w:1180px}
#app[data-scr=nuevo],#app[data-scr=editar]{--w:880px}
#app[data-scr=saldos],#app[data-scr=ajustes],#app[data-scr=accesos],#app[data-scr=cuenta]{--w:760px}
.hero .cn,.sheet .cn{max-width:var(--w);margin-left:auto;margin-right:auto}
.sheet .cn.narrow{max-width:460px}
.navright{display:none}
@media (max-width:899px){
body.kb #nav{display:none}
body.kb .nbar{bottom:8px}
}
@media (min-width:900px){
#app{max-width:none;margin:0;padding:64px 0 40px;display:block}
#nav{top:0;bottom:auto;left:0;right:0;width:auto;height:64px;flex-direction:row;align-items:center;justify-content:flex-start;gap:6px;padding:0 20px;border:none;border-bottom:1px solid var(--line);border-radius:0;background:var(--surface);box-shadow:none}
#nav button{flex:none;min-height:44px;flex-direction:row;gap:8px;padding:0 16px;font-size:15px;border-radius:12px}
.navlogo{display:flex;align-items:center;gap:10px;margin:0 22px 0 0}
.navlogo .serif{display:inline}
.navright{display:flex;align-items:center;gap:10px;margin-left:auto}
.navright .ib.lo{height:44px}
#app>.hero{background:transparent;border-bottom:none;padding:26px 24px 4px}
#app>.sheet{padding:10px 24px 40px;min-height:0}
.hero .brand,.hero .hright{display:none}
.htop{min-height:0}
.htop:not(:has(.ib:not(.lo))){display:none}
.ht{font-size:40px;margin-top:0}
.big{font-size:76px}
.stats{max-width:560px}
#toast{bottom:32px}
#modal{align-items:center}
#modal .mb{border-bottom:1px solid var(--line);border-radius:26px;padding-top:26px;transform:translateY(var(--y)) scale(var(--s));opacity:0;transition:transform 140ms var(--ease),opacity 120ms ease}
#modal .mb::before{display:none}
#modal.open .mb{transform:none;opacity:1;transition:transform 260ms var(--pop),opacity 160ms ease}
.nbar{bottom:14px}
.menu{max-width:640px}
}

/* Pedidos: tarjetas, buscador, filtros y tabla */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0 14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kv{font-size:30px;line-height:1.1;font-weight:500;white-space:nowrap}
.kl{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.25}
.kpi.bad{border-color:var(--bad);background:var(--debt-bg)}
.kpi.bad .kv{color:var(--bad)}
.kpi.warn .kv{color:var(--warn)}
.ptool{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
input[type=search].fi{-webkit-appearance:none;appearance:none}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none}
.fbar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 6px}
.pill .cnt{display:inline-block;min-width:22px;padding:0 6px;margin-left:4px;border-radius:999px;background:color-mix(in srgb,var(--text) 12%,transparent);font-size:12px;font-weight:700;line-height:20px;text-align:center}
.pill.on .cnt{background:color-mix(in srgb,var(--btn-ink) 20%,transparent)}
@media (min-width:700px){
.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}
.ptool{grid-template-columns:minmax(0,1fr) 270px}
}
.ptab{width:100%;border-collapse:separate;border-spacing:0 6px}
.ptab th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;color:var(--muted);text-align:left;padding:6px 14px 2px}
.ptab td{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 14px;vertical-align:middle}
.ptab td:first-child{border-left:1px solid var(--line);border-radius:14px 0 0 14px}
.ptab td:last-child{border-right:1px solid var(--line);border-radius:0 14px 14px 0}
.trow{cursor:pointer}
.trow:focus-visible{outline:3px solid var(--ring);outline-offset:-3px;border-radius:14px}
.trow.sel td{border-color:var(--accent);background:var(--surface2)}
.c-n{width:60px;white-space:nowrap}
.c-n b{font-size:16px;font-weight:600}
.c-cl{min-width:0}
.c-cl .nm{display:block;font-size:16px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.c-cl .mut{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chips:empty{display:none}
.only-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.c-en span{display:block}
.c-en .chip{display:inline-flex;margin-top:4px}
.lt{color:var(--bad)}
.c-co .ticks{margin-bottom:4px}
.c-to{text-align:right;white-space:nowrap;font-size:17px}
.c-sa{text-align:right;white-space:nowrap}
.ptab th.c-to,.ptab th.c-sa{text-align:right}
.debt-t{color:var(--bad);font-weight:700}
.ptab .ghead td{background:transparent;border:none;border-radius:0;padding:20px 4px 4px}
.gh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gt{font-size:21px}
.gc{min-width:28px;padding:0 9px;border-radius:999px;background:var(--line2);color:var(--muted);font-size:13px;font-weight:700;line-height:26px;text-align:center}
.gbtn{width:auto;height:44px;margin:0 0 0 auto;padding:0 18px}
.chip.c-bad{background:var(--debt-fill);color:var(--debt-ink)}
.ptab .gnone td{background:transparent;border:none;color:var(--muted);padding:8px 4px}
@media (max-width:899px){
.c-en,.c-co,.c-es{display:none}
.ptab td{padding:12px 10px}
.c-n{width:44px}
}
@media (min-width:900px){
.only-m{display:none}
.c-n{width:70px}
.c-en{width:190px}
.c-co{width:130px}
.c-es{width:120px}
.c-to{width:100px}
.c-sa{width:130px}
}

/* Detalle del pedido: panel lateral derecho */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45;opacity:0;visibility:hidden;transition:opacity 180ms ease,visibility 0s linear 180ms}
#scrim.open{opacity:1;visibility:visible;transition:opacity 220ms ease,visibility 0s}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);z-index:50;background:var(--bg);border-left:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;transform:translateX(100%);visibility:hidden;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));transition:transform 200ms var(--ease),visibility 0s linear 200ms}
#panel.open{transform:none;visibility:visible;transition:transform 300ms var(--drawer),visibility 0s}
@media (prefers-reduced-motion:reduce){#panel,#panel.open,#scrim,#scrim.open{transition:none}}
body.plock{overflow:hidden}
.phead{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 14px;border-bottom:1px solid var(--line)}
.phead .kick{margin:0}
.pname{font-size:28px;line-height:1.1;margin-top:4px;overflow-wrap:anywhere}
.pbtn{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex:none}
.pbody{padding:6px 20px 0}
.pclose{height:44px}
#panel .fi,.nuevo .fi{scroll-margin-bottom:150px}

/* Nuevo pedido: una columna ancha y barra fija abajo */
.cn.nuevo{display:block}
.cut-h{justify-content:space-between}
.cdel{width:44px;height:44px;padding:0;margin:0}
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cg-d{grid-column:1/-1}
.cfoot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-top:6px}
.cfoot .ck{flex:1 1 220px}
.cg-c{flex:1 1 200px}
.csub{flex:1 1 100%;display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
.nbar-sum{display:flex;gap:18px;flex:1;min-width:0}
.ns{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.ns .mut{font-size:12px}
.ns b{font-size:24px;white-space:nowrap}
#n5r.red b,#n5r.red .mut{color:var(--bad)}
#n5r.okk b{color:var(--ok)}
.nuevo .nbar .btn{flex:none;width:220px;height:52px}
@media (max-width:599px){
.nuevo .nbar-in{flex-direction:column;align-items:stretch;gap:8px}
.nuevo .nbar-sum{justify-content:space-between;gap:8px}
.nuevo .nbar .btn{width:100%;height:48px}
.ns b{font-size:20px}
}
@media (min-width:900px){
.cgrid{grid-template-columns:2fr 1fr 1fr}
.cg-d{grid-column:auto}
.csub{flex:0 0 auto;border-top:none;padding-top:0;margin:0 0 0 auto;gap:10px}
}
.mtabs{margin-top:4px}
#app[data-scr=pedidos] .hero,#app[data-scr=saldos] .hero,#app[data-scr=cuenta] .hero{padding-bottom:12px}
#app[data-scr=pedidos] .ht,#app[data-scr=cuenta] .ht{font-size:30px;margin-top:6px}
.tab{height:44px}
.ib.lo{height:44px}
@media (max-width:899px){
.ptab{table-layout:fixed}
.ptab th,.ptab td{padding-left:8px;padding-right:8px}
.c-n{width:46px}
.c-to{width:70px;font-size:15px}
.c-sa{width:98px}
.debt-t,.c-sa .good{font-size:14px}
.c-cl .chip{white-space:normal;line-height:1.25}
}
@media (max-width:899px){
.ptab thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.kpis{gap:8px;margin-bottom:10px}
.kpi{padding:10px 12px}
.kv{font-size:24px}
.kl{font-size:12px;margin-top:2px}
.fbar{margin-top:10px}
.pill{padding:0 14px}
}
</style>
</head>
<body>
<div id="cargando"></div>
<div id="app"></div>
<div id="scrim" data-a="pclose"></div>
<aside id="panel" role="dialog" aria-modal="true" aria-label="Detalle del pedido" aria-hidden="true"></aside>
<nav id="nav" aria-label="Menú principal" style="display:none"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
