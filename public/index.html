<!doctype html>
<html lang="es" data-brand="fucsia">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Telas JY</title>
<meta name="theme-color" content="#5A0E3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Telas JY">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#F3F3F0;--surface:#FFFFFF;--surface2:#F8F8F6;--line:#E4E3DD;--line2:#ECEBE6;--text:#15172B;--muted:#5A5D70;--field:#FFFFFF;--field-line:#CFCDC4;
--ok:#1F7A4D;--warn:#B7791F;--bad:#C0392B;--brass:#D8B76E;--brass-line:#B8934A;--brass-text:#7A5A1C;--navact:var(--hero);
--hero:#5A0E3D;--hero-muted:#EBC6DA;--accent:#B01C75;--btn:#8E1463;--debt-block:#8F1D14;color-scheme:light}
@media (prefers-color-scheme:dark){
:root{--bg:#101012;--surface:#1A1A1F;--surface2:#212127;--line:#32323A;--line2:#2A2A31;--text:#EDEDF1;--muted:#A8AAB8;--field:#1A1A1F;--field-line:#4B4B56;--brass-text:#D8B76E;--navact:#FFFFFF;--accent:#F27BBE;--btn:#B01C75;color-scheme:dark}
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Figtree',system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hero);z-index:50}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brass-line);outline-offset:2px}
.serif{font-family:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;font-weight:500;font-variant-numeric:lining-nums}
#app{max-width:720px;margin:0 auto;padding-bottom:96px}
.hero{background:var(--hero);color:#fff;padding:18px 20px 0;position:relative;overflow:hidden}
.hero .cn,.sheet .cn{max-width:980px;margin:0 auto}
.sheet .cn.narrow{max-width:460px}
.sheet{background:var(--surface);padding:8px 16px 28px;min-height:60vh}
.htop{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.brand{display:flex;align-items:center;gap:10px}
.mono{width:36px;height:36px;border-radius:50%;border:1.5px solid #D8B76E;color:#D8B76E;display:inline-flex;align-items:center;justify-content:center;font-family:'Bodoni Moda','Didot',Georgia,serif;font-weight:600;font-size:15px}
.mono.big{width:68px;height:68px;font-size:28px}
.rolechip{border:1px solid rgba(255,255,255,.4);color:#fff;font-size:12px;font-weight:500;padding:5px 12px;border-radius:999px}
.ib{width:44px;height:44px;border:none;background:none;color:#fff;display:inline-flex;align-items:center;justify-content:center;margin-left:-10px}
.kick{margin-top:18px;font-size:13px;color:#D8B76E;font-weight:500}
.ht{font-size:34px;line-height:1.1;margin-top:6px}
.big{font-size:56px;line-height:1.05;margin-top:2px}
.hsub{font-size:14px;color:var(--hero-muted);margin-top:6px}
.stats{display:grid;margin-top:16px}
.st{padding:0 12px;border-left:1px solid rgba(255,255,255,.2)}
.st:first-child{padding-left:0;border-left:none}
.sv{font-size:24px}
.sl{font-size:12px;color:var(--hero-muted)}
.st.w .sv,.st.w .sl{color:#FFB3AD}
.ruler{display:block;margin-top:16px}
.trama{position:absolute;inset:0;pointer-events:none}
.h1{font-size:28px;margin:22px 0 14px;line-height:1.15}
.h2{font-size:24px;margin:0}
.lb{display:block;font-size:13px;font-weight:700;margin:0 0 5px}
.fi{height:50px;width:100%;border:1px solid var(--field-line);border-radius:12px;background:var(--field);color:var(--text);padding:0 14px;font-size:16px}
select.fi{padding:0 10px}
.fld{margin-bottom:12px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{height:52px;width:100%;border-radius:14px;border:none;background:var(--btn);color:#fff;font-weight:700;font-size:16px;padding:0 20px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.b{background:var(--brass);color:#14171A}
.btn.o{background:transparent;border:1.5px solid var(--brass-line);color:var(--brass-text)}
.btn.o2{background:transparent;border:1px solid var(--text);color:var(--text)}
.btn.w{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff}
.btn.sm{height:44px;font-size:14px;border-radius:12px}
.btn+.btn{margin-top:10px}
.mut{color:var(--muted);font-size:13px}
.err{color:color-mix(in srgb,var(--bad) 60%,var(--text));font-size:13px;font-weight:700;min-height:18px;margin:6px 0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-top:6px}
.tab{height:46px;padding:0 14px;border:none;border-bottom:2px solid transparent;background:none;color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap;margin-bottom:-1px}
.tab.on{color:var(--text);font-weight:700;border-bottom-color:var(--brass-line)}
.pills{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.pill{height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-weight:500;font-size:14px;white-space:nowrap}
.pill.on{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:700}
.seg{display:flex;gap:3px;background:var(--line2);border-radius:12px;padding:3px}
.seg button{flex:1;height:44px;border:none;border-radius:9px;background:transparent;color:var(--text);font-weight:500;font-size:14px}
.seg button.on{background:var(--btn);color:#fff;font-weight:700}
.seg.dk{background:rgba(255,255,255,.16)}
.seg.dk button{color:#fff}
.seg.dk button.on{background:#fff;color:#8F1D14}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.c-prog{background:color-mix(in srgb,var(--accent) 16%,var(--surface));color:color-mix(in srgb,var(--accent) 55%,var(--text))}
.c-ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:color-mix(in srgb,var(--ok) 60%,var(--text))}
.c-warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface));color:color-mix(in srgb,var(--warn) 60%,var(--text))}
.c-done{background:var(--line2);color:var(--muted)}
.c-late{border:1px solid var(--bad);color:color-mix(in srgb,var(--bad) 60%,var(--text))}
.c-cancel{background:color-mix(in srgb,var(--bad) 16%,var(--surface));color:color-mix(in srgb,var(--bad) 60%,var(--text))}
.debt{background:color-mix(in srgb,var(--bad) 14%,var(--surface));color:color-mix(in srgb,var(--bad) 62%,var(--text));font-weight:700;font-size:13px;padding:4px 10px;border-radius:8px;white-space:nowrap}
.good{color:color-mix(in srgb,var(--ok) 60%,var(--text));font-weight:700}
.ord{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line2);padding:14px 4px}
.ord:last-child{border-bottom:none}
.l{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ticks{display:flex;gap:3px}
.tk{width:18px;height:4px;border-radius:2px;background:var(--line)}
.tk.f{background:var(--text)}
.box{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px 14px}
.sec{padding:22px 0 8px;border-bottom:1px solid var(--line2)}
.sec:last-child{border-bottom:none}
.crow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2)}
.crow:last-child{border-bottom:none}
.crow input[type=checkbox],.ck input{width:26px;height:26px;accent-color:var(--btn);margin:0;flex:none}
.ck{display:flex;align-items:center;gap:12px;min-height:44px;font-size:15px}
.st-t{text-decoration:line-through;color:var(--muted)}
.saldo{background:var(--debt-block);color:#fff;border-radius:18px;padding:20px;margin:18px 0}
.saldo .big{font-size:52px}
.pagado{background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:color-mix(in srgb,var(--ok) 60%,var(--text));border-radius:18px;padding:16px 20px;margin:18px 0;font-weight:700;font-size:16px}
.note{background:color-mix(in srgb,var(--warn) 16%,var(--surface));border-radius:14px;padding:12px 14px;margin:0 0 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.aviso{background:#FFE9A8;color:#4A3500;font-weight:700;text-align:center;padding:10px 16px}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 6px;font-weight:700}
.hrow{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;margin-bottom:6px}
.empty{text-align:center;color:var(--muted);padding:28px 0}
.menu{display:flex;width:100%;align-items:center;justify-content:space-between;min-height:56px;background:none;border:none;border-bottom:1px solid var(--line2);text-align:left;font-weight:700;font-size:16px;padding:0 4px}
#cargando{position:fixed;left:0;right:0;top:0;height:3px;background:var(--brass);z-index:80;display:none}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
#nav button{flex:1;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;border-top:3px solid transparent;margin-top:-1px;color:var(--muted);font-size:12px;font-weight:500}
#nav button.on{color:var(--navact);font-weight:700;border-top-color:var(--brass-line)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--hero);color:#fff;padding:12px 18px;border-radius:12px;font-weight:500;z-index:70;max-width:90%;display:none;text-align:center}
#modal{position:fixed;inset:0;background:rgba(10,10,14,.55);z-index:60;display:none;align-items:flex-end;justify-content:center}
#modal .mb{background:var(--surface);width:min(520px,100%);border-radius:20px 20px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px))}
.navlogo{display:none}
@media (min-width:900px){
#app{max-width:none;margin-left:240px;padding-bottom:48px}
#nav{top:0;bottom:0;right:auto;width:240px;flex-direction:column;justify-content:flex-start;gap:4px;padding:28px 14px;background:var(--hero);border-top:none}
#nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;min-height:46px;padding:0 14px;border-radius:12px;border-top:none;margin-top:0;color:var(--hero-muted);font-size:15px}
#nav button.on{background:rgba(255,255,255,.12);color:#fff;border-top:none}
.navlogo{display:flex;align-items:center;gap:12px;color:#fff;margin:0 0 24px 6px}
#toast{left:calc(50% + 120px)}
#modal{align-items:center}
#modal .mb{border-radius:20px}
.sheet{padding:12px 32px 40px}
.hero{padding:24px 40px 0}
}
</style>
</head>
<body>
<div id="cargando"></div>
<div id="app"></div>
<nav id="nav" aria-label="Menú principal" style="display:none"></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
